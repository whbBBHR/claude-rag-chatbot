[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragchatbot-codebase"
version = "0.1.0"
description = "A RAG-based chatbot system for course materials"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "RAG Chatbot Team", email = "team@ragchatbot.com"}
]
license = {text = "MIT"}
keywords = ["rag", "chatbot", "ai", "nlp", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "chromadb>=0.4.0",
    "anthropic>=0.25.0",
    "sentence-transformers>=2.2.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "transformers>=4.21.0",
    "torch>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "isort>=5.10.0",
]

[project.scripts]
ragchatbot-server = "backend.app:main"
ragchatbot-cli = "backend.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/ragchatbot-codebase"
Documentation = "https://github.com/yourusername/ragchatbot-codebase#readme"
Repository = "https://github.com/yourusername/ragchatbot-codebase"
Issues = "https://github.com/yourusername/ragchatbot-codebase/issues"

[tool.setuptools]
packages = ["backend", "frontend"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.yaml", "*.yml"]
"frontend" = ["*.html", "*.css", "*.js"]
"docs" = ["*.txt"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3
